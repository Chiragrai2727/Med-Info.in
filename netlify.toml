[build]
command = "CI=false npm run build"
publish = "dist"
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

# Payment API redirects → Netlify Functions
[[redirects]]
from = "/api/create-order"
to = "/.netlify/functions/create-order"
status = 200

[[redirects]]
from = "/api/verify-payment"
to = "/.netlify/functions/verify-payment"
status = 200

# ✅ REMOVED the broken /api/* catch-all that was causing issues

# SPA fallback — must be LAST
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache headers for static assets
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.woff2"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.jpeg"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.webp"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.svg"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
